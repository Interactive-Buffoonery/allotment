name: Allotment
options:
  bundleIdPrefix: com.serabi
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 7CNK4YPCQX
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.1
targets:
  Allotment:
    type: application
    platform: iOS
    sources: Allotment
    info:
      path: Allotment/Info.plist
      properties:
        CFBundleDisplayName: Allotment
        UIAppFonts:
          - Fraunces-SemiBold.ttf
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLockup
          UIImageRespectSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.allotment
        PRODUCT_NAME: Allotment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - AllotmentTests
  AllotmentTests:
    type: bundle.unit-test
    platform: iOS
    sources: AllotmentTests
    dependencies:
      - target: Allotment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.allotment.tests
