name: SynView
options:
  bundleIdPrefix: com.serabi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 7CNK4YPCQX
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.1.2
targets:
  SynView:
    type: application
    platform: iOS
    sources: SynView
    info:
      path: SynView/Info.plist
      properties:
        CFBundleDisplayName: SynView
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.synview
        PRODUCT_NAME: SynView
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - SynViewTests
  SynViewTests:
    type: bundle.unit-test
    platform: iOS
    sources: SynViewTests
    dependencies:
      - target: SynView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.synview.tests
